<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="100%" stop-color="#10223B" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" stroke="#A25722" stroke-width="1.2" />
  
  <!-- Outer Civic Orbit -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#FAF8F3" stroke-width="0.8" stroke-dasharray="1.5 1" opacity="0.4" />
  
  <!-- Ashoka / Dharma Chakra 8 Spokes -->
  <g stroke="#A25722" stroke-width="1" stroke-linecap="round">
    <line x1="16" y1="7" x2="16" y2="25" />
    <line x1="7" y1="16" x2="25" y2="16" />
    <line x1="9.64" y1="9.64" x2="22.36" y2="22.36" />
    <line x1="9.64" y1="22.36" x2="22.36" y2="9.64" />
  </g>
  
  <!-- Central Shield / Apex Core -->
  <polygon points="16,8.5 21.5,14 19.5,21.5 12.5,21.5 10.5,14" fill="#1B365D" stroke="#FAF8F3" stroke-width="1.2" stroke-linejoin="round" />
  
  <!-- Upward Innovation Arrowhead -->
  <polygon points="16,11 19.5,17 16,15.5 12.5,17" fill="#A25722" />
  
  <!-- Central Hub Jewel -->
  <circle cx="16" cy="18" r="1.5" fill="#FAF8F3" />
</svg>
